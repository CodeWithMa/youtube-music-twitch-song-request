[project]
name = "youtube-music-api-client"
version = "0.1.0"
description = "Api client for youtube-music api server plugin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_music_api_client"]
